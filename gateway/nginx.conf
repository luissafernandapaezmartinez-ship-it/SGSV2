worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;

    upstream monolito {
        server monolito:5000;
    }

    upstream ms_salones {
        server salones:5002;
    }

    server {
        listen 80;
        server_name _;

        # Tabla de ruteo del API Gateway:
        #   /gateway/health  -> el propio gateway
        #   /api/salones*    -> microservicio ms-salones
        #   todo lo demás    -> monolito Flask (login, reservas, docentes, frontend)

        location = /gateway/health {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"status":"ok","gateway":"nginx","routes":{"/api/salones":"ms-salones:5002","default":"monolito:5000"}}';
        }

        location /api/salones {
            proxy_pass http://ms_salones;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://monolito;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
